template-file-path: templates/00-main.yaml

# MoodleProd-deployment.yaml
Parameters:
  ProjectName: MoodleProd
  EnvironmentName: prod
  
  # Domain & DNS
  HostedZoneName: compasscollegeandseminary.com
  DomainName: online.compasscollegeandseminary.com
  
  # Notifications
  NotificationEmail: jpcunningh@gmail.com
  
  # Networking
  NumberOfAZs: 2
  AvailabilityZones: 
    - us-east-1a
    - us-east-1b
  
  # Web Tier
  WebTierInstanceType: t4g.medium
  
  # Database - Serverless with Free Tier safe settings
  EnableServerless: true
  DatabaseEngine: aurora-mysql
  DatabaseMinCapacity: 1
  DatabaseMaxCapacity: 1        # You requested 1 (very conservative)
  BackupRetentionPeriod: 7      # Critical for Free Tier
  
  # Caching
  SessionCacheNodeType: cache.t4g.medium
  ApplicationCacheNodeType: cache.t4g.medium
  
  # CloudFront
  EnableCloudFront: true
  CloudFrontCertificateArn: arn:aws:acm:us-east-1:901889465674:certificate/d8aef774-214a-486c-bae6-2f4070fe21bf
  
  # ALB Certificate
  LoadBalancerCertificateArn: arn:aws:acm:us-east-1:901889465674:certificate/d8aef774-214a-486c-bae6-2f4070fe21bf
  
  # Storage Encryption
  EnableEfsEncryption: true
  
  # Other recommended defaults
  CreateBastionHost: false
  EnableElastiCache: true
